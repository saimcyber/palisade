# =============================================================================
#  M1 - vLLM serving Qwen3-0.6B, in-cluster.
#
#  Raw manifests, not Helm - Helm and GitOps are M3's job (see the project
#  plan); doing them here would blur the milestones.
#
#  Same two GPU requirements as every other pod in this cluster:
#    runtimeClassName: nvidia
#    annotation cdi.k8s.io/gpu: "nvidia.com/gpu=all"
#  (docs/adr/0002-gpu-in-k3d.md)
#
#  Two WSL2-specific settings, both hard-won in the M1 host-Docker spike and
#  recorded in docs/CONVENTIONS.md:
#    VLLM_WSL2_ENABLE_PIN_MEMORY=1  - vLLM v0.28 hard-requires pinned memory
#                                     for its UVA-backed buffers; vLLM's own
#                                     platform layer disables it by default
#                                     under any WSL2 kernel.
#    --gpu-memory-utilization 0.6    - 0.85 fails outright: WSL2/the desktop
#                                     already holds back part of the 4 GB
#                                     card, so the free-memory check at
#                                     startup rejects a higher fraction. This
#                                     value only gates vLLM's initial
#                                     free-memory check now (see below).
#    --kv-cache-memory-bytes 512M    - 0.7 was enough for the *weights* on
#                                     host Docker (Task 2), but in-cluster,
#                                     vLLM's percentage-based KV-cache
#                                     auto-sizing reproducibly overshot real
#                                     free memory at 0.7 AND 0.6 AND even
#                                     with --max-model-len halved to 2048 -
#                                     each attempt died needing just 30-50 MiB
#                                     more, which halving context length
#                                     barely moved. That pattern - the ask
#                                     barely changing while the budget did -
#                                     means the percentage math itself is
#                                     working from a skewed number somewhere
#                                     in the nested k3d-node-container CDI
#                                     path, not that the budget was merely
#                                     too small. --kv-cache-memory-bytes
#                                     bypasses that percentage calculation
#                                     entirely and states the KV cache size
#                                     directly; 512M comfortably covers
#                                     max-model-len=4096 for a 0.6B model.
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-hf-cache
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: palisade
spec:
  # k3s's built-in dynamic provisioner. A restart re-uses downloaded weights
  # instead of re-pulling ~1.4 GiB from the HuggingFace Hub every time.
  storageClassName: local-path
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: palisade
spec:
  # One GPU, one replica - see docs/adr/0005-no-autoscaling-on-the-model-tier.md.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
      annotations:
        cdi.k8s.io/gpu: "nvidia.com/gpu=all"
    spec:
      runtimeClassName: nvidia
      # Kubernetes injects <SERVICE>_PORT etc. env vars for every Service the
      # pod can see, named after the Service - and our Service is named
      # "vllm". vLLM reads VLLM_PORT itself for internal IPC, so it received
      # "tcp://10.43.x.x:8000" (a URI) instead of a bare port number and
      # crashed with ValueError: VLLM_PORT '...' appears to be a URI. This is
      # what the earlier "Unknown vLLM environment variable" warnings for
      # VLLM_SERVICE_HOST etc. were quietly warning about - most were noise,
      # this one wasn't. Disabling service-link injection is the standard
      # fix for the whole class of Service-name/app-env-var collision.
      enableServiceLinks: false
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.28.0
          imagePullPolicy: IfNotPresent
          args:
            - --model=Qwen/Qwen3-0.6B
            - --served-model-name=palisade-small
            - --max-model-len=4096
            - --gpu-memory-utilization=0.6
            - --kv-cache-memory-bytes=512M
            - --enforce-eager
          env:
            - name: VLLM_WSL2_ENABLE_PIN_MEMORY
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              memory: 8Gi
          # Model load (download + weight load + KV cache profiling) takes far
          # longer than any liveness probe would tolerate. Without a startup
          # probe the kubelet kills the container mid-load and it restarts
          # forever, never actually finishing. Generous budget: up to 10
          # minutes on a cold cache (first pull from the HF Hub), well under
          # a minute once vllm-hf-cache is warm.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: vllm-hf-cache
        # vLLM's default /dev/shm (64Mi) is too small for its worker IPC.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: palisade
spec:
  selector:
    app.kubernetes.io/name: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
