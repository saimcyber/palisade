namespace: palisade

# One numeric UID for every pod in the chart. It has to be numeric: the
# images declare a *named* user (USER palisade / USER verify), and the
# kubelet refuses runAsNonRoot when it cannot prove a name maps to a
# non-zero UID (CreateContainerConfigError). 999 is what `useradd --system`
# assigned in both images. Sharing it also matters functionally:
# model-verify writes the HF cache that vLLM reads from and locks in.
uid: 999

gateway:
  image:
    repository: ghcr.io/saimcyber/palisade-gateway
    # Pinned by digest, never a tag - Kyverno rejects :latest outright
    # (ADR 0013), and a digest is the only reference cosign's verifyImages
    # can meaningfully check against a signature made for one exact build.
    # Bumped automatically by ci.yml's bump-digest job - GATEWAY_DIGEST is
    # its anchor, don't remove it even though it renders as a no-op comment.
    digest: sha256:fa01a73a43d64fe086ad35ee1044e58b53e50001f82bf20faf05923984407e73 # GATEWAY_DIGEST
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  ingress:
    enabled: true
    className: traefik
    host: palisade.local
  env:
    servedModelName: palisade-small
    maxTokensCeiling: 512
    logLevel: INFO
    defaultRateLimitPerMinute: 60
    defaultTokenBudget: 20000
    budgetWindowSeconds: 86400
    responseCacheTtlSeconds: 300
  # The one real secret this chart needs (auth.py never sees a raw key,
  # only accepted hashes, plus each tenant's name/rate-limit/budget -
  # ADR 0015 covers how this gets to the cluster without ever being a
  # plaintext value in git; ADR 0021 covers why it's a secret, not Redis).
  tenantsSecretName: palisade-gateway-secret

redis:
  image:
    repository: redis
    # Verified against Docker Hub's tag list before pinning (project rule)
    # - same tag-only precedent as vllm.image above; Kyverno's signature
    # check is scoped to ghcr.io/saimcyber/* only (ADR 0013), so this
    # third-party image is outside what it verifies either way.
    tag: 7.4.11-alpine
  port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

vllm:
  image:
    repository: vllm/vllm-openai
    tag: v0.28.0
  model: Qwen/Qwen3-0.6B
  # Must equal "revision" in deploy/model-manifests/qwen3-0.6b.json - the
  # exact commit model-verify checked the SHA-256 of every file against.
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  servedModelName: palisade-small
  maxModelLen: 4096
  gpuMemoryUtilization: 0.6
  kvCacheMemoryBytes: 512M
  hfCache:
    storageClassName: local-path
    size: 10Gi
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      memory: 8Gi
  modelVerify:
    image:
      # Built, scanned, signed and pushed by its own workflow -
      # .github/workflows/model-verify-image.yml - separate from ci.yml
      # since it rebuilds on a manifest change too, not just its own code.
      # Bumped automatically by that workflow's bump-digest job.
      repository: ghcr.io/saimcyber/palisade-model-verify
      digest: "sha256:1abfbc3f4aa9e1af7c0188456f47a39b97eecc11d9b79e612af3e77785fea370" # MODEL_VERIFY_DIGEST
    manifest: qwen3-0.6b
