# Backs tenancy.py's rate-limit/budget counters and cache.py's response
# cache (ADR 0021) - no PersistentVolumeClaim, by design, and far simpler
# than a PVC that would reintroduce the WaitForFirstConsumer sync-wave
# deadlock ADR 0017 already fixed once for vLLM's cache.
#
# The "no PVC means a restart resets every counter" framing this comment
# used to carry is only half true - found live in M5's chaos day
# (docs/evidence/m5/04-chaos-redis-shutdown.txt). The stock redis image's
# default periodic `save` directives write dump.rdb into this emptyDir
# regardless, and emptyDir survives a container restarting in place
# within the same Pod - so a crash Kubernetes recovers without
# rescheduling the Pod actually reloads recent state. Only a real Pod
# reschedule (node drain, eviction, `kubectl delete pod`) gets a
# genuinely empty /data. Both are acceptable cold-starts for a
# portfolio-scale platform; the point of this file is that neither case
# needs a PVC, not that every restart is stateless.
#
# sync-wave 0, same as model-verify (ADR 0020 app-of-apps ordering still
# governs policies-before-workloads at the Application level) - no
# dependency between Redis and the model, so running in the same wave as
# model-verify costs nothing and keeps the gateway (wave 2) correctly
# waiting for both.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "palisade.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        {{- include "palisade.labels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # The official image's "redis" user is 999 - same numeric value as
        # .Values.uid, coincidentally; not shared on purpose the way
        # model-verify/vLLM's uid is (they share an HF cache, this doesn't).
        runAsUser: {{ .Values.uid }}
        runAsGroup: {{ .Values.uid }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: {{ .Values.redis.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          emptyDir: {}
