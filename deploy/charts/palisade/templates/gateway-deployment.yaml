# Every field under securityContext here is also a Kyverno rule (ADR 0013)
# - written to already satisfy the policy that will admit it, not written
# loosely and patched later once something gets rejected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: palisade-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "palisade.labels" . | nindent 4 }}
    app.kubernetes.io/name: palisade-gateway
  annotations:
    # After vLLM (wave 1): the gateway is only useful once its backend
    # exists. This used to be load-bearing - readiness was /readyz, which is
    # only 200 once vLLM answers, so in the same wave the two waited on each
    # other forever (seen on the first real sync). Readiness no longer
    # depends on vLLM (ADR 0027), but the ordering is still the right one.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: palisade-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: palisade-gateway
        {{- include "palisade.labels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # Numeric, not inherited from the image - see values.yaml `uid`.
        runAsUser: {{ .Values.uid }}
        runAsGroup: {{ .Values.uid }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}@{{ .Values.gateway.image.digest }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          # `prefix` is a field of the envFrom entry, a sibling of
          # configMapRef/secretRef - not nested inside them. Nested, the API
          # server silently drops it: the gateway then reads none of its
          # PALISADE_* settings (running on defaults, with no API-key
          # hashes) and Argo CD sees a permanent diff it re-applies forever.
          envFrom:
            - prefix: PALISADE_
              configMapRef:
                name: palisade-gateway-config
            # Secret's own key must be named TENANTS (becomes
            # PALISADE_TENANTS via the same prefix) - see ADR 0015 for the
            # envFrom-prefix mechanism and ADR 0021 for why tenant facts
            # are a secret rather than Redis-resident.
            - prefix: PALISADE_
              secretRef:
                name: {{ .Values.gateway.tenantsSecretName }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          # /healthz, not /readyz (ADR 0027). /readyz checks vLLM and Redis,
          # and every gateway replica shares both - so gating readiness on
          # them never routes around a failure, it only removes every
          # replica at once. During a vLLM outage that turned the gateway's
          # own audited, counted 503 into Traefik's anonymous "no available
          # server", and took the gateway's /metrics out of Prometheus for
          # exactly the length of the incident. The gateway already fails
          # closed per request when either dependency is down.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
