# Every field under securityContext here is also a Kyverno rule (ADR 0013)
# - written to already satisfy the policy that will admit it, not written
# loosely and patched later once something gets rejected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: palisade-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "palisade.labels" . | nindent 4 }}
    app.kubernetes.io/name: palisade-gateway
  annotations:
    # After vLLM (wave 1), never before it. /readyz is only 200 once vLLM
    # answers, and Argo CD will not start a wave until the previous one is
    # Healthy - with the gateway in the default wave 0 the two wait on
    # each other forever (seen on the first real sync).
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: palisade-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: palisade-gateway
        {{- include "palisade.labels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # Numeric, not inherited from the image - see values.yaml `uid`.
        runAsUser: {{ .Values.uid }}
        runAsGroup: {{ .Values.uid }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}@{{ .Values.gateway.image.digest }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          # `prefix` is a field of the envFrom entry, a sibling of
          # configMapRef/secretRef - not nested inside them. Nested, the API
          # server silently drops it: the gateway then reads none of its
          # PALISADE_* settings (running on defaults, with no API-key
          # hashes) and Argo CD sees a permanent diff it re-applies forever.
          envFrom:
            - prefix: PALISADE_
              configMapRef:
                name: palisade-gateway-config
            # Secret's own key must be named API_KEY_HASHES (becomes
            # PALISADE_API_KEY_HASHES via the same prefix) - see the
            # example in ADR 0015.
            - prefix: PALISADE_
              secretRef:
                name: {{ .Values.gateway.apiKeyHashesSecretName }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
