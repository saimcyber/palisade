# Deliberately its own Job, not a vLLM initContainer - see ADR 0012 and
# the comment at the top of vllm-deployment.yaml. As an Argo CD `Sync`
# hook it runs as part of the sync itself (not before it, which would
# deadlock against the PVC below never having been created yet on a first
# deploy), deleted and recreated on every sync
# (hook-delete-policy: BeforeHookCreation) so a manifest or image change
# always re-verifies rather than silently reusing a stale Job.
#
# sync-wave "0": after the PVC (wave -1, must be Bound to mount), before
# vLLM's own Deployment (wave 1, which needs this to have exited 0 first).
apiVersion: batch/v1
kind: Job
metadata:
  name: model-verify
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "palisade.labels" . | nindent 4 }}
    app.kubernetes.io/name: model-verify
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 1
  # A pod that can never start (bad securityContext, missing secret) is
  # not a *failure* to the Job controller, so backoffLimit never fires and
  # Argo CD waits on this hook forever. A hard deadline turns that into a
  # visible failed sync instead of a silent hang.
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-verify
        {{- include "palisade.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        # Same UID as vLLM: this Job writes the shared HF cache that vLLM
        # then reads (and writes lock files into).
        runAsUser: {{ .Values.uid }}
        runAsGroup: {{ .Values.uid }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-verify
          image: "{{ .Values.vllm.modelVerify.image.repository }}@{{ .Values.vllm.modelVerify.image.digest }}"
          env:
            - name: HF_HOME
              value: /hf-cache
            - name: MODEL_MANIFEST
              value: {{ .Values.vllm.modelVerify.manifest }}
            # cosign caches Sigstore's TUF trust root under $HOME/.sigstore.
            # The image's HOME (/home/verify) was never created and the
            # root filesystem is read-only, so point it at an emptyDir.
            - name: HOME
              value: /scratch
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: hf-cache
              mountPath: /hf-cache
            - name: scratch
              mountPath: /scratch
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: hf-cache
          persistentVolumeClaim:
            claimName: vllm-hf-cache
