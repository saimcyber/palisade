# Every hard-won M1 setting (docs/CONVENTIONS.md, ADR 0002, 0005) carries
# over unchanged - templated, not re-derived.
#
# Model verification is deliberately NOT an initContainer here - see
# templates/model-verify-job.yaml and ADR 0012 for why: NetworkPolicy
# can't distinguish one container's egress needs from another's within the
# same pod, and the verifier needs real internet egress (Hugging Face,
# Sigstore) that vLLM's own container must never have. Splitting them into
# separate pods is what lets both be simultaneously true: the verify Job
# gets a permissive NetworkPolicy scoped to its own short life, this
# Deployment's pod gets the zero-egress policy the plan's acceptance
# criterion actually asks for.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "palisade.labels" . | nindent 4 }}
    app.kubernetes.io/name: vllm
  annotations:
    # Waits for the model-verify Job (wave 0) to complete first - weights
    # guaranteed present and verified before this ever starts.
    argocd.argoproj.io/sync-wave: "1"
spec:
  # One GPU, one replica - docs/adr/0005-no-autoscaling-on-the-model-tier.md.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        {{- include "palisade.labels" . | nindent 8 }}
      annotations:
        cdi.k8s.io/gpu: "nvidia.com/gpu=all"
    spec:
      runtimeClassName: nvidia
      # A Service named after its own app collides with vLLM's own
      # VLLM_PORT env var - the M1 finding this fix exists for.
      enableServiceLinks: false
      # The upstream image runs as root by default. Nothing in vLLM needs
      # root once the weights are already on disk, so it is held to the
      # same baseline as every other pod (ADR 0019) rather than exempted.
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.uid }}
        runAsGroup: {{ .Values.uid }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          image: "{{ .Values.vllm.image.repository }}:{{ .Values.vllm.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --model={{ .Values.vllm.model }}
            # Pinned to the commit the signed manifest names. model-verify
            # downloads by commit SHA, which writes no refs/main into the
            # HF cache - offline, a bare repo id would not resolve.
            - --revision={{ .Values.vllm.revision }}
            - --served-model-name={{ .Values.vllm.servedModelName }}
            - --max-model-len={{ .Values.vllm.maxModelLen }}
            - --gpu-memory-utilization={{ .Values.vllm.gpuMemoryUtilization }}
            - --kv-cache-memory-bytes={{ .Values.vllm.kvCacheMemoryBytes }}
            - --enforce-eager
          env:
            - name: VLLM_WSL2_ENABLE_PIN_MEMORY
              value: "1"
            - name: HF_HOME
              value: /hf-cache
            # model-verify calls snapshot_download(cache_dir=$HF_HOME), so
            # the repo lands at /hf-cache/models--*, not the default
            # $HF_HOME/hub/models--*. Point the hub cache at the same root.
            - name: HF_HUB_CACHE
              value: /hf-cache
            # Zero egress (networkpolicy-vllm.yaml) means any network call
            # at startup stalls until timeout. Weights are already on the
            # PVC, verified by model-verify, so tell every library so.
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            # Read-only root filesystem: every cache vLLM / torch / triton
            # writes is redirected to the writable emptyDir.
            - name: HOME
              value: /scratch
            - name: XDG_CACHE_HOME
              value: /scratch/.cache
            - name: VLLM_CACHE_ROOT
              value: /scratch/.cache/vllm
            - name: TRITON_CACHE_DIR
              value: /scratch/.cache/triton
            # UID {{ .Values.uid }} has no /etc/passwd entry in this image;
            # getpass.getuser() falls back to these instead of raising.
            - name: USER
              value: vllm
            - name: LOGNAME
              value: vllm
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: hf-cache
              mountPath: /hf-cache
            - name: scratch
              mountPath: /scratch
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
          resources:
            {{- toYaml .Values.vllm.resources | nindent 12 }}
          # Model load (weight load + KV-cache profiling) takes far longer
          # than any liveness probe would tolerate - without this the
          # kubelet kills the container mid-load and it never finishes
          # starting. The model-verify Sync-hook Job (model-verify-job.yaml,
          # sync-wave 0) already guarantees the weights are downloaded and
          # correct on the shared PVC before this Deployment (sync-wave 1)
          # is ever applied, so this container's own startup is engine
          # init only, not a first-time download - the generous budget
          # just covers a genuinely slow node, not a network fetch.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: vllm-hf-cache
        - name: scratch
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
