# Non-secret settings only - config.py's env_prefix is PALISADE_, so every
# key here becomes PALISADE_<KEY> in the container. The one real secret
# (PALISADE_TENANTS) comes from {{ .Values.gateway.tenantsSecretName }}
# instead - see ADR 0015 and ADR 0021.
apiVersion: v1
kind: ConfigMap
metadata:
  name: palisade-gateway-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "palisade.labels" . | nindent 4 }}
    app.kubernetes.io/name: palisade-gateway
data:
  UPSTREAM_BASE_URL: "http://vllm:8000"
  SERVED_MODEL_NAME: {{ .Values.gateway.env.servedModelName | quote }}
  MAX_TOKENS_CEILING: {{ .Values.gateway.env.maxTokensCeiling | quote }}
  LOG_LEVEL: {{ .Values.gateway.env.logLevel | quote }}
  REDIS_URL: "redis://redis:{{ .Values.redis.port }}/0"
  DEFAULT_RATE_LIMIT_PER_MINUTE: {{ .Values.gateway.env.defaultRateLimitPerMinute | quote }}
  DEFAULT_TOKEN_BUDGET: {{ .Values.gateway.env.defaultTokenBudget | quote }}
  BUDGET_WINDOW_SECONDS: {{ .Values.gateway.env.budgetWindowSeconds | quote }}
  RESPONSE_CACHE_TTL_SECONDS: {{ .Values.gateway.env.responseCacheTtlSeconds | quote }}
