# Split from palisade-observability (ADR 0023) for one mechanical reason:
# the sops-decrypt CMP's generate command concatenates every *.yaml file in
# an Application's source path with no document separator - safe for a
# directory holding exactly one file, which is all this one ever will.
# Wave "2", strictly before palisade-observability's "3" - mirrors
# palisade-secrets (wave 0) preceding palisade (wave 1) for the identical
# reason: Grafana's Deployment reads this Secret, so it must exist first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: palisade-observability-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/saimcyber/palisade.git
    targetRevision: main
    path: deploy/observability-secrets
    plugin:
      name: sops-decrypt
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
