# Deliberately decoupled from the core chain (ADR 0023): sync-wave "3",
# strictly after palisade (wave 1) is Healthy, and never the reverse - a
# problem in Prometheus or Grafana must never block the gateway or vLLM
# from deploying, the way a problem in policies (wave -1) or secrets
# (wave 0) legitimately would. Also after palisade-observability-secrets
# (wave 2) - Grafana's Deployment here reads that Secret. Plain directory
# sync, no plugin: every file in this directory is plaintext (the one
# secret this stack needs lives in deploy/observability-secrets/ instead,
# for a reason that has nothing to do with wave ordering - see that
# Application's own comment).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: palisade-observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/saimcyber/palisade.git
    targetRevision: main
    path: deploy/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
