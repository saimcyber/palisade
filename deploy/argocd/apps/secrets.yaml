# Explicit plugin reference rather than relying on auto-discovery -
# deploy/secrets/ is the one source path that genuinely needs the
# sops-decrypt CMP (ADR 0015), so it names it rather than assuming Argo
# CD's glob-based discovery finds it unprompted.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: palisade-secrets
  annotations:
    # Before the workloads: the gateway's envFrom needs this Secret to exist.
    argocd.argoproj.io/sync-wave: "0"
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saimcyber/palisade.git
    targetRevision: main
    path: deploy/secrets
    plugin:
      name: sops-decrypt
  destination:
    server: https://kubernetes.default.svc
    namespace: palisade
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
