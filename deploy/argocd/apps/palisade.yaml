apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: palisade
  namespace: argocd
  annotations:
    # Last: only once policies (wave -1) and secrets (wave 0) report
    # Healthy - see the Application health check in argocd-values.yaml.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/saimcyber/palisade.git
    targetRevision: main
    path: deploy/charts/palisade
  destination:
    server: https://kubernetes.default.svc
    namespace: palisade
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
