apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: palisade
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saimcyber/palisade.git
    targetRevision: main
    path: deploy/charts/palisade
  destination:
    server: https://kubernetes.default.svc
    namespace: palisade
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
