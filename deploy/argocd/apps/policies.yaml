# Plain directory sync, no Helm/Kustomize - these are static, reviewed
# policy documents (ADR 0013, 0014), not something that needs templating.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: palisade-policies
  namespace: argocd
  annotations:
    # First: Kyverno policies and NetworkPolicies must be in force before
    # any workload exists to be admitted or reached (ADR 0020).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/saimcyber/palisade.git
    targetRevision: main
    path: deploy/policies
    # Non-recursive is the default. Don't spell it out as
    # `directory: {recurse: false}`: Argo CD normalises an all-default
    # `directory` block away on the live object, so the root app would
    # report this Application OutOfSync forever.
  destination:
    server: https://kubernetes.default.svc
    namespace: palisade
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # This app now syncs before the chart that declares the palisade
    # Namespace, and its NetworkPolicies live in that namespace - so it has
    # to be able to create it. The chart's own Namespace manifest adopts
    # it afterwards (CreateNamespace does not track what it creates).
    syncOptions:
      - CreateNamespace=true
