apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-security
  namespace: monitoring
  labels:
    grafana-dashboard: "true"
data:
  security.json: |
    {
      "title": "Palisade / Security",
      "uid": "palisade-security",
      "schemaVersion": 39,
      "timezone": "utc",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1, "title": "Auth failures by reason",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum(rate(palisade_auth_failures_total[5m])) by (reason)",
            "legendFormat": "{{reason}}"}]
        },
        {
          "id": 2, "title": "Prompt guard blocks by reason",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum(rate(palisade_prompt_guard_blocks_total[5m])) by (reason)",
            "legendFormat": "{{reason}}"}]
        },
        {
          "id": 3, "title": "Rate-limited requests by tenant",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum(rate(palisade_rate_limited_total[5m])) by (tenant)",
            "legendFormat": "{{tenant}}"}]
        },
        {
          "id": 4, "title": "Kyverno admission denials by rule",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum(increase(kyverno_policy_results_total{rule_result=\"fail\"}[1h])) by (policy_name, rule_name)",
            "legendFormat": "{{policy_name}}/{{rule_name}}"}]
        }
      ]
    }
