apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-slo
  namespace: monitoring
  labels:
    grafana-dashboard: "true"
data:
  slo.json: |
    {
      "title": "Palisade / SLO",
      "uid": "palisade-slo",
      "schemaVersion": 39,
      "timezone": "utc",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1, "title": "Request rate by status",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum(rate(palisade_http_requests_total[5m])) by (status)",
            "legendFormat": "{{status}}"}]
        },
        {
          "id": 2, "title": "Error rate (5xx / total, chat completions)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum(rate(palisade_http_requests_total{route=\"/v1/chat/completions\",status=~\"5..\"}[5m])) / sum(rate(palisade_http_requests_total{route=\"/v1/chat/completions\"}[5m]))",
            "legendFormat": "error rate"}]
        },
        {
          "id": 3, "title": "p95 request latency",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "histogram_quantile(0.95, sum(rate(palisade_http_request_duration_seconds_bucket[5m])) by (le, route))",
            "legendFormat": "{{route}}"}]
        },
        {
          "id": 4, "title": "p95 time to first token",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "histogram_quantile(0.95, sum(rate(palisade_time_to_first_token_seconds_bucket[5m])) by (le))",
            "legendFormat": "p95 TTFT"}]
        }
      ]
    }
