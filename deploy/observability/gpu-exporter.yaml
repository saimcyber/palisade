# The actual GPU exporter decision (ADR 0023): the NVIDIA device plugin
# cannot work under WSL2 (ADR 0002), and the same NVML gap rules out
# dcgm-exporter - it sits on the identical layer. This wraps `nvidia-smi`
# instead, which is already proven to work in a CDI pod (make gpu-check).
# Needs the same two things every GPU pod in this project needs -
# runtimeClassName: nvidia and the cdi.k8s.io/gpu annotation - nothing
# else about it is special.
#
# Originally the third-party utkuozdemir/nvidia_gpu_exporter - replaced
# (docker/gpu-exporter/) after confirming live that image's minimal
# filesystem was only half the problem. The real fix was
# NVIDIA_DRIVER_CAPABILITIES=utility, which tells nvidia-container-runtime's
# CDI hook to inject nvidia-smi at all - see the Dockerfile's header and
# ADR 0023 for the full investigation, including the full-filesystem
# rebuild that alone wasn't sufficient.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: gpu-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-exporter
      annotations:
        cdi.k8s.io/gpu: "nvidia.com/gpu=all"
    spec:
      runtimeClassName: nvidia
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gpu-exporter
          # Built, scanned, signed and pushed by its own workflow -
          # .github/workflows/gpu-exporter-image.yml - bumped
          # automatically by its bump-digest job.
          image: ghcr.io/saimcyber/palisade-gpu-exporter@sha256:6e5cbe2110bba13af6d5da325616d9203502ed12ade20677854f59612d2acc6c # GPU_EXPORTER_DIGEST
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          ports:
            - name: metrics
              containerPort: 9835
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: gpu-exporter
spec:
  selector:
    app.kubernetes.io/name: gpu-exporter
  ports:
    - name: metrics
      port: 9835
      targetPort: metrics
