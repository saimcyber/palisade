# Argo CD, with one addition to the stock chart: a sidecar Config
# Management Plugin on repo-server that runs `sops -d` on anything named
# *.enc.yaml before Argo CD ever sees its contents. See ADR 0015 - the
# only piece this doesn't provide is the age private key itself, which
# scripts/setup-sops-age.sh provisions separately, by hand, once.
configs:
  cm:
    # Without this, vllm-hf-cache (storageClassName: local-path, which only ever
    # binds WaitForFirstConsumer) deadlocks the palisade chart's sync-waves: the PVC
    # stays Pending - correctly, by design - until the model-verify Job (wave 0, its
    # first consumer) is scheduled, but Argo CD won't create wave 0 until the PVC's
    # wave reports Healthy. Confirmed live - see ADR 0017. This reports any PVC with
    # a status.phase as Healthy; sync-wave ordering still governs apply order, which
    # is the only ordering guarantee this chart actually needs.
    resource.customizations.health.PersistentVolumeClaim: |
      hs = {}
      if obj.status ~= nil and obj.status.phase ~= nil then
        hs.status = "Healthy"
        hs.message = obj.status.phase
      else
        hs.status = "Progressing"
        hs.message = "Waiting for status.phase"
      end
      return hs
    # App-of-apps ordering (ADR 0020). The root app gives palisade-policies
    # sync-wave -1 and the workloads wave 1, so on a fresh cluster the
    # Kyverno policies exist before any workload pod is admitted. But Argo CD
    # (since 1.8) reports a child Application as Healthy the instant it
    # exists, so waves between Applications would order *creation* only, not
    # wait for the child's sync. This restores the documented health check:
    # a child Application is only as healthy as it reports itself.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
  cmp:
    create: true
    plugins:
      sops-decrypt:
        generate:
          command: ["sh", "-c"]
          args:
            - >-
              find . -name '*.enc.yaml' -exec sops -d {} \; ;
              find . -not -name '*.enc.yaml' -name '*.yaml' -exec cat {} \;
        discover:
          find:
            glob: "**/*.enc.yaml"

repoServer:
  extraContainers:
    - name: sops-decrypt
      command: ["/var/run/argocd/argocd-cmp-server"]
      # Built, scanned, signed and pushed by its own workflow -
      # .github/workflows/sops-cmp-image.yml - bumped automatically by its
      # bump-digest job. No credible official sops container image exists
      # to depend on instead (checked; see docker/sops-cmp/Dockerfile's own
      # header for what was ruled out and why).
      image: ghcr.io/saimcyber/palisade-sops-cmp@sha256:dd403a2267f39a113f287e808b6aa22ebc26ca3d76aed4e0655b3d366d1e8f5c # SOPS_CMP_DIGEST
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      env:
        - name: SOPS_AGE_KEY_FILE
          value: /sops-age/key.txt
      volumeMounts:
        - mountPath: /var/run/argocd
          name: var-files
        - mountPath: /home/argocd/cmp-server/plugins
          name: plugins
        - mountPath: /tmp
          name: sops-tmp
        - mountPath: /sops-age
          name: sops-age
          readOnly: true
        # Missing on the first version of this file - the sidecar crashed
        # with "open .../plugin.yaml: no such file or directory" on a real
        # deploy, because `configs.cmp.create: true` only creates the
        # argocd-cmp-cm ConfigMap; it doesn't wire the mount into
        # extraContainers automatically. The key inside it matches the
        # plugin name (sops-decrypt.yaml) - confirmed by reading the
        # ConfigMap the chart actually produced, not assumed.
        - mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: sops-decrypt.yaml
          name: cmp-plugin-config
  volumes:
    - name: sops-tmp
      emptyDir: {}
    - name: cmp-plugin-config
      configMap:
        name: argocd-cmp-cm
    - name: sops-age
      secret:
        # Provisioned by scripts/setup-sops-age.sh, never by Terraform or
        # Argo CD itself - the one deliberate manual step in this chain.
        secretName: sops-age

# self-heal + automated pruning is set on each Application resource
# (deploy/argocd/), not here - this file is only the Argo CD installation
# itself.
