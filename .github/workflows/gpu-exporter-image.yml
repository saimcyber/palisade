# Builds, scans, pushes and signs the GPU exporter (ADR 0023) - replaces
# the third-party utkuozdemir/nvidia_gpu_exporter, whose minimal image
# and missing NVIDIA_DRIVER_CAPABILITIES env var left CDI's injection hook
# with no nvidia-smi to place. Same pipeline shape as sops-cmp-image.yml
# and model-verify-image.yml - a separate workflow because it's a
# separate, independently-versioned image with its own trigger path.
name: gpu-exporter-image

on:
  push:
    branches: [main]
    paths:
      - "docker/gpu-exporter/**"
      - ".github/workflows/gpu-exporter-image.yml"
  pull_request:
    paths:
      - "docker/gpu-exporter/**"
      - ".github/workflows/gpu-exporter-image.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/saimcyber/palisade-gpu-exporter

jobs:
  build-scan-sign-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/gpu-exporter
          push: false
          load: true
          tags: ${{ env.IMAGE }}:scan

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          trivyignores: docker/gpu-exporter/.trivyignore

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/gpu-exporter
          push: true
          tags: ${{ env.IMAGE }}:latest

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -fsSL "https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz" | tar -xz -C /tmp
          sudo install -m 0755 /tmp/syft /usr/local/bin/syft
          syft "${IMAGE}@${{ steps.push.outputs.digest }}" -o spdx-json > sbom.spdx.json

      # Pinned explicitly - see ci.yml's comment on the same line and ADR 0018.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # Plain defaults - see ci.yml's comment on the same lines and ADR 0018.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json \
            "${IMAGE}@${{ steps.push.outputs.digest }}"

  bump-digest:
    needs: build-scan-sign-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: bump the gpu-exporter digest
        run: |
          set -euo pipefail
          sed -i "s|image: ${{ env.IMAGE }}@sha256:[a-f0-9]\{64\} # GPU_EXPORTER_DIGEST|image: ${{ env.IMAGE }}@${{ needs.build-scan-sign-push.outputs.digest }} # GPU_EXPORTER_DIGEST|" \
            deploy/observability/gpu-exporter.yaml
          if git diff --quiet deploy/observability/gpu-exporter.yaml; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "bump/gpu-exporter-digest-${{ github.run_id }}"
          git add deploy/observability/gpu-exporter.yaml
          git commit -m "observability: bump gpu-exporter digest to ${{ needs.build-scan-sign-push.outputs.digest }}"
          git push -u origin "bump/gpu-exporter-digest-${{ github.run_id }}"
          gh pr create --title "Bump gpu-exporter digest" \
            --body "Automated - the signed image this points at just changed." \
            --base main --head "bump/gpu-exporter-digest-${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
