# Palisade infrastructure pipeline: plan on a PR, apply only on a push to
# main - never the other way around. See docs/adr/0009 for why this root
# (infra/terraform/aws/app) is the only Terraform CI is trusted with, and
# why plan and apply assume two different, narrowly-scoped IAM roles rather
# than one role that could do both.
#
# infra/terraform/aws/bootstrap/ is applied only by hand and is
# intentionally untouched by this workflow.
name: terraform

on:
  pull_request:
    paths:
      - "infra/terraform/aws/app/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/aws/app/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_ROOT: infra/terraform/aws/app

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write # to post the plan as a PR comment - not contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::316899784254:role/palisade-ci-plan
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"

      - working-directory: ${{ env.TF_ROOT }}
        run: terraform fmt -check -diff

      - working-directory: ${{ env.TF_ROOT }}
        run: terraform init -input=false

      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present.
      # Both 0 and 2 are a healthy plan; only 1 should fail the job.
      - working-directory: ${{ env.TF_ROOT }}
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode 2>&1 | tee /tmp/plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/plan.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `#### Terraform plan (\`${process.env.TF_ROOT}\`)\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`
            });

      - if: steps.plan.outputs.exitcode != '0' && steps.plan.outputs.exitcode != '2'
        run: exit 1

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::316899784254:role/palisade-ci-apply
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"

      - working-directory: ${{ env.TF_ROOT }}
        run: terraform init -input=false

      - working-directory: ${{ env.TF_ROOT }}
        run: terraform apply -input=false -auto-approve
