# Palisade gateway pipeline: lint, test, build, scan-gate, push, sign, attest.
#
# Nothing after the Trivy gate runs unless the gate passed - that's the
# whole point of M2 (docs/adr/0007, 0008, 0010). Signing and pushing only
# happen on a real push to main; a pull_request run builds and scans but
# stops there, since there is nothing yet worth signing.
#
# Default permissions are read-only; each job below states exactly what
# more it needs and why.
name: ci

on:
  push:
    branches: [main]
    paths:
      - "services/gateway/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "services/gateway/**"
      - ".github/workflows/ci.yml"

# Queue, don't run in parallel - see model-verify-image.yml's comment on
# this same block for why: two concurrent runs building "the same" source
# can produce two different image digests, and whichever push lands last
# silently wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/saimcyber/palisade-gateway

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # terraform_fmt (one of the pre-commit hooks below) needs a real
      # terraform binary on PATH - found missing here (exit 127) the first
      # time this job ran for real; it had only ever been exercised locally,
      # where terraform was already installed for other reasons.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
      - run: pip install --no-cache-dir pre-commit
      # Runs directly, not `make lint`, and without `|| true` - a lint step
      # that cannot fail is not a gate.
      - run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - working-directory: services/gateway
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements-dev.txt
          python -m pytest -q

  build-scan-sign-push:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign's OIDC exchange with Fulcio/Rekor
      packages: write # push to ghcr.io - only takes effect on a same-repo push;
      # GitHub forces a read-only token for fork PR runs regardless of this
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build once, locally, before anything is pushed - the Trivy gate has
      # to run against the actual image, and nothing should reach the
      # registry that hasn't passed it yet.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/gateway
          push: false
          load: true
          tags: ${{ env.IMAGE }}:scan

      # Pinned >= v0.35.0 deliberately - trivy-action, setup-trivy and the
      # trivy binary itself were distributed compromised before that fix
      # (github.com/aquasecurity/trivy/discussions/10425). See docs/adr/0010.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          trivyignores: services/gateway/.trivyignore

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/gateway
          push: true
          tags: ${{ env.IMAGE }}:latest
          # digest output feeds the sign/attest steps below - signing and
          # attesting by digest, never by the mutable :latest tag.

      # Installed as a pinned release binary (same pattern as
      # scripts/install-tools.sh), not a piped install script and not a
      # third-party sbom-action - one fewer thing in the signing chain's
      # trust surface to reason about.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -fsSL "https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz" | tar -xz -C /tmp
          sudo install -m 0755 /tmp/syft /usr/local/bin/syft
          syft "${IMAGE}@${{ steps.push.outputs.digest }}" -o spdx-json > sbom.spdx.json

      # Pinned explicitly to the version verified against this project's
      # policies from the WSL host, rather than trusting the installer's
      # own default - see ADR 0018.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # Keyless: no COSIGN_EXPERIMENTAL needed on cosign v3 (that flag was a
      # v1-era requirement, checked directly against `cosign sign --help`
      # before assuming it still applied here). The signing identity is the
      # job's own OIDC token - see docs/adr/0008.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json \
            "${IMAGE}@${{ steps.push.outputs.digest }}"

  # "git is the only route to production" (M3's own goal) only holds if the
  # pipeline that signs a new image also proposes the chart change to
  # deploy it - a human editing values.yaml by hand after every push would
  # just be CI/CD with extra steps. Opens a PR rather than pushing directly
  # to main, matching the project plan's own architecture diagram.
  bump-digest:
    needs: build-scan-sign-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: bump the gateway digest in values.yaml
        run: |
          set -euo pipefail
          sed -i "s|digest: sha256:[a-f0-9]\{64\} # GATEWAY_DIGEST|digest: ${{ needs.build-scan-sign-push.outputs.digest }} # GATEWAY_DIGEST|" \
            deploy/charts/palisade/values.yaml
          if git diff --quiet deploy/charts/palisade/values.yaml; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "bump/gateway-digest-${{ github.run_id }}"
          git add deploy/charts/palisade/values.yaml
          git commit -m "chart: bump gateway digest to ${{ needs.build-scan-sign-push.outputs.digest }}"
          git push -u origin "bump/gateway-digest-${{ github.run_id }}"
          gh pr create --title "Bump gateway digest" \
            --body "Automated - the signed image this points at just changed." \
            --base main --head "bump/gateway-digest-${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
