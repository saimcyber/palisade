# Builds, scans, pushes and signs the SOPS Config Management Plugin
# sidecar Argo CD's repo-server uses to decrypt deploy/secrets/*.enc.yaml
# (ADR 0015) - same pipeline shape as ci.yml and model-verify-image.yml
# (ADR 0007, 0008, 0010), a separate workflow because it's a separate,
# independently-versioned image with its own trigger path.
name: sops-cmp-image

on:
  push:
    branches: [main]
    paths:
      - "docker/sops-cmp/**"
      - ".github/workflows/sops-cmp-image.yml"
  pull_request:
    paths:
      - "docker/sops-cmp/**"
      - ".github/workflows/sops-cmp-image.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/saimcyber/palisade-sops-cmp

jobs:
  build-scan-sign-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/sops-cmp
          push: false
          load: true
          tags: ${{ env.IMAGE }}:scan

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          trivyignores: docker/sops-cmp/.trivyignore

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/sops-cmp
          push: true
          tags: ${{ env.IMAGE }}:latest

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -fsSL "https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz" | tar -xz -C /tmp
          sudo install -m 0755 /tmp/syft /usr/local/bin/syft
          syft "${IMAGE}@${{ steps.push.outputs.digest }}" -o spdx-json > sbom.spdx.json

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # --registry-referrers-mode=legacy: see ci.yml's comment on the same
      # flag and docs/adr/0018. This image isn't Kyverno-verified today
      # (the policy only scopes palisade-gateway*/palisade-model-verify*),
      # but there's no reason to sign it in a format only half the
      # project's own tooling can read.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes --registry-referrers-mode=legacy "${IMAGE}@${{ steps.push.outputs.digest }}"
          cosign attest --yes --registry-referrers-mode=legacy --type spdxjson --predicate sbom.spdx.json \
            "${IMAGE}@${{ steps.push.outputs.digest }}"

  bump-digest:
    needs: build-scan-sign-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: bump the sops-cmp digest
        run: |
          set -euo pipefail
          sed -i "s|image: ${{ env.IMAGE }}@sha256:[a-f0-9]\{64\} # SOPS_CMP_DIGEST|image: ${{ env.IMAGE }}@${{ needs.build-scan-sign-push.outputs.digest }} # SOPS_CMP_DIGEST|" \
            infra/terraform/cluster/argocd-values.yaml
          if git diff --quiet infra/terraform/cluster/argocd-values.yaml; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "bump/sops-cmp-digest-${{ github.run_id }}"
          git add infra/terraform/cluster/argocd-values.yaml
          git commit -m "argocd: bump sops-cmp digest to ${{ needs.build-scan-sign-push.outputs.digest }}"
          git push -u origin "bump/sops-cmp-digest-${{ github.run_id }}"
          gh pr create --title "Bump sops-cmp digest" \
            --body "Automated - the signed image this points at just changed." \
            --base main --head "bump/sops-cmp-digest-${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
