# Builds, scans, pushes and signs the model-verification init container -
# same pipeline shape as ci.yml (ADR 0007, 0008, 0010), a separate workflow
# because the build context, triggers and image are different: this one
# bakes in deploy/model-manifests/, so it also has to rebuild whenever a
# manifest (or its signature) changes, not just when the container's own
# code does.
name: model-verify-image

on:
  push:
    branches: [main]
    paths:
      - "docker/model-verify/**"
      - "deploy/model-manifests/**"
      - ".github/workflows/model-verify-image.yml"
  pull_request:
    paths:
      - "docker/model-verify/**"
      - "deploy/model-manifests/**"
      - ".github/workflows/model-verify-image.yml"

# Queue, don't run in parallel: two rapid pushes (e.g. this workflow's own
# rebase-triggered runs) building the "same" source concurrently produced
# two different image digests - Docker builds aren't perfectly
# reproducible - and each pushed :latest, so whichever finished last won,
# silently orphaning the other's bump-digest PR. Found for real, not
# anticipated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/saimcyber/palisade-model-verify

jobs:
  build-scan-sign-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/model-verify/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:scan

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          trivyignores: docker/model-verify/.trivyignore

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/model-verify/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -fsSL "https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz" | tar -xz -C /tmp
          sudo install -m 0755 /tmp/syft /usr/local/bin/syft
          syft "${IMAGE}@${{ steps.push.outputs.digest }}" -o spdx-json > sbom.spdx.json

      # Pinned explicitly - see ci.yml's comment on the same line and ADR
      # 0018: the installer's default predates --registry-referrers-mode.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # --registry-referrers-mode=legacy: see ci.yml's comment on the same
      # flag and docs/adr/0018 - cosign v3's OCI-1.1-referrers default isn't
      # readable by Kyverno v1.19.1's verifyImages attestor on a registry
      # without a Referrers API (GHCR).
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes --registry-referrers-mode=legacy "${IMAGE}@${{ steps.push.outputs.digest }}"
          cosign attest --yes --registry-referrers-mode=legacy --type spdxjson --predicate sbom.spdx.json \
            "${IMAGE}@${{ steps.push.outputs.digest }}"

  # Opens (or updates) a PR that bumps values.yaml's modelVerify digest to
  # what was just pushed - the same "automated digest bump (PR)" hand-off
  # the project plan's architecture diagram shows M2's pipeline making to
  # M3's GitOps layer, now that there's a second signed image for it to do
  # that with.
  bump-digest:
    needs: build-scan-sign-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: bump the digest in values.yaml
        run: |
          set -euo pipefail
          sed -i "s|digest: \".*\" # MODEL_VERIFY_DIGEST|digest: \"${{ needs.build-scan-sign-push.outputs.digest }}\" # MODEL_VERIFY_DIGEST|" \
            deploy/charts/palisade/values.yaml
          if git diff --quiet deploy/charts/palisade/values.yaml; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "bump/model-verify-digest-${{ github.run_id }}"
          git add deploy/charts/palisade/values.yaml
          git commit -m "chart: bump model-verify digest to ${{ needs.build-scan-sign-push.outputs.digest }}"
          git push -u origin "bump/model-verify-digest-${{ github.run_id }}"
          gh pr create --title "Bump model-verify digest" \
            --body "Automated - the signed image this points at just changed." \
            --base main --head "bump/model-verify-digest-${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
